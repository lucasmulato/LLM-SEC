services:
  llmsec-mcp:
    build: .
    stdin_open: true
    tty: false
    init: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
