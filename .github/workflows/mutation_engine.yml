name: Adversarial Mutation Gate

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  mutation-gate:
    name: 15-Mutant Adversarial Verification Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mutation engine
        run: |
          cargo build -p mutation_engine

      - name: Run 15-Mutant Adversarial Engine (100% catch rate required)
        run: |
          cargo run -p mutation_engine

      - name: Archive Mutation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation_report.md
