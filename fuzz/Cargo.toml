[package]
name = "llmsec-fuzz"
version = "0.1.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ssi-ledger = { path = "../crates/ssi-ledger" }
ssi-csl = { path = "../crates/ssi-csl" }
ssi-kernel = { path = "../crates/ssi-kernel" }
wad18 = { path = "../crates/wad18" }
serde_json = "1.0"

[[bin]]
name = "fuzz_canonical_decoder"
path = "fuzz_targets/fuzz_canonical_decoder.rs"
test = false
doc = false

[[bin]]
name = "fuzz_csl_envelope"
path = "fuzz_targets/fuzz_csl_envelope.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wad18_arithmetic"
path = "fuzz_targets/fuzz_wad18_arithmetic.rs"
test = false
doc = false
