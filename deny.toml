# cargo-deny configuration for LLM-SEC high-assurance gateway
# Rule 1 (Fail-Closed) & Rule 2 (Zero-Float) & Rule 7 (Security Hardening)

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"
unsound = "deny"
ignore = []

[licenses]
version = 2
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
version = 2
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
version = 2
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
