[package]
name = "ssi-real-estate"
version = "0.1.0"
edition = "2021"
description = "SSI Real-Estate Underwriting Domain Pack (Russell 2026 Narrow Superintelligence for Real Estate)"

[dependencies]
ssi-kernel = { path = "../../crates/ssi-kernel" }
ssi-gate = { path = "../../crates/ssi-gate" }
ssi-csl = { path = "../../crates/ssi-csl" }
ssi-ledger = { path = "../../crates/ssi-ledger" }
ssi-pco = { path = "../../crates/ssi-pco" }
ssi-r3 = { path = "../../crates/ssi-r3" }
wad18 = { path = "../../crates/wad18" }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["rand_core"] }
rand = { version = "0.8", default-features = false, features = ["getrandom"] }

[[bin]]
name = "csl_signer"
path = "src/bin/csl_signer.rs"

[[bin]]
name = "re_demo"
path = "src/bin/re_demo.rs"

[[bin]]
name = "re_redteam"
path = "src/bin/re_redteam.rs"
